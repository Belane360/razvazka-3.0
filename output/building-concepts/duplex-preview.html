import * as THREE from '/node_modules/three/build/three.module.js';
import {GameState} from '/src/core/GameState.ts';
import {HexMeshBuilder} from '/src/render/HexMeshBuilder.ts';
const game=new GameState();game.speed=0;
for(const f of [...game.districts.facilities.values()])game.districts.remove(f.center);

for(const [q,r,type] of [[-3,3,'Factory'],[3,3,'Warehouse']]){
  if(!game.build({q,r},type,'ground',0,3,undefined,'elevated','superhex_7'))throw new Error(game.message);

const paths=[
  Array.from({length:11},(_,i)=>[i-5,5]),
  ...[-5,-1,1,5].map(q=>[[q,5],[q,4],[q,3]])
];
for(const path of paths)for(let i=0;i<path.length;i++){const [q,r]=path[i];game.build({q,r},'road','ground',0,3,i?{q:path[i-1][0],r:path[i-1][1]}:undefined);}
game.build({q:-5,r:1},'Home','ground',0,3);
const scene=new THREE.Scene(),builder=new HexMeshBuilder();builder.build(game);scene.add(builder.root);
scene.add(new THREE.HemisphereLight(0xffefd9,0x8c997b,1.8));const sun=new THREE.DirectionalLight(0xffe2bb,2.2);sun.position.set(-80,150,75);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(devicePixelRatio);renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0xd9dfc8);document.body.append(renderer.domElement);
const aspect=innerWidth/innerHeight,half=Math.max(62,115/aspect),camera=new THREE.OrthographicCamera(-half*aspect,half*aspect,half,-half,0.1,1000);camera.position.set(26,130,205);camera.lookAt(26,0,50);renderer.render(scene,camera);
</script></html>
